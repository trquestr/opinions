# Только для локальной разработки: Postgres и Redis для apps/api.
# Запуск: docker compose up -d --wait
name: opinions

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: opinions
      POSTGRES_USER: opinions
      POSTGRES_PASSWORD: opinions
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U opinions -d opinions']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
