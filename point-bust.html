<title>Небесный музей — Давид: живой слепок и орбита</title>
<style>
  :root{
    --milk:#f4f1e9;
    --ink:#2a2620;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--milk);
    overflow:hidden;
    font-family:Georgia,'Times New Roman',serif;
    color:var(--ink);
  }
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  .plate{
    position:fixed;left:50%;bottom:34px;transform:translateX(-50%);

    user-select:none;-webkit-user-select:none;
  }

    font-weight:normal;
    font-size:19px;
    letter-spacing:0.01em;
    margin-bottom:7px;
  }
  .plate .hint{
    font-family:-apple-system,'Segoe UI',system-ui,sans-serif;
    font-size:13.5px;
    color:#5d574d;
  }
  .plate button{
    pointer-events:auto;
    margin-top:12px;
    font-family:-apple-system,'Segoe UI',system-ui,sans-serif;
    font-size:13.5px;
    color:var(--milk);
    background:var(--ink);
    border:none;
    border-radius:999px;
    padding:8px 20px;
    cursor:pointer;
    transition:background 0.2s ease, transform 0.15s ease;
  }
  .plate button:hover{background:#000;transform:scale(1.02)}
  .plate button:active{transform:scale(0.98)}
  .plate button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .credit{
    position:fixed;right:16px;bottom:12px;
    font-family:-apple-system,'Segoe UI',system-ui,sans-serif;
    font-size:11.5px;color:#9b958a;
    user-select:none;-webkit-user-select:none;pointer-events:none;
  }
</style>

const FRAG = `#version 300 es
precision highp float;
out vec4 outColor;

uniform vec2 u_res;
uniform float u_dpr;
uniform sampler2D u_grid;
uniform vec2 u_gridSize;

// Вытянутая капля: сфера, растянутая по dir на stretch (эллипсоидный SDF)
float sdDroplet(vec2 p, vec2 c, vec2 dir, float r, float stretch) {
  vec2 d = p - c;
  float along = dot(d, dir);
  float perp = dot(d, vec2(-dir.y, dir.x));
  float a = r * (1.0 + stretch * 0.9);
  float b = r / sqrt(1.0 + stretch * 0.55);
  vec2 scaled = vec2(along / a, perp / b);
  float l = length(scaled);
  if (l == 0.0) return -max(a, b);
  return (l - 1.0) * min(a, b);
}

// Плавный минимум smin (полиномиальный, с контролем диапазона)
float smin(float a, float b, float k) {
  if (k <= 0.001) return min(a, b);
  float h = max(k - abs(a - b), 0.0) / k;
  return min(a, b) - h * h * k * 0.25;
}

void main(){
  vec2 p = vec2(gl_FragCoord.x / u_dpr - u_res.x * 0.5,
                gl_FragCoord.y / u_dpr - u_res.y * 0.5);
  float aa = 0.75 / u_dpr;

  float d = 1e5;

  ivec2 gc = ivec2(floor((p + u_res * 0.5) / ${CELL}.0));
  ivec2 gs = ivec2(u_gridSize);

  for (int cy = -1; cy <= 1; cy++) {
    int y = gc.y + cy;
    if (y < 0 || y >= gs.y) continue;
    int row0 = y * ${K_SLOTS * 2};
    for (int cx = -1; cx <= 1; cx++) {
      int x = gc.x + cx;
      if (x < 0 || x >= gs.x) continue;
      for (int s = 0; s < ${K_SLOTS}; s++) {
        vec4 t0 = texelFetch(u_grid, ivec2(x, row0 + s * 2), 0);
        if (t0.z <= 0.05) break;                       // слоты записаны плотно
        
        // Оптимизация: для круглых капель в покое (stretch < 0.02) пропускаем
        // чтение второго терора t1 и сложный расчет sdDroplet
        float dd;
        if (t0.w < 0.02) {
          dd = length(p - t0.xy) - t0.z;
        } else {
          vec4 t1 = texelFetch(u_grid, ivec2(x, row0 + s * 2 + 1), 0);
          dd = sdDroplet(p, t0.xy, t1.xy, t0.z, t0.w);

        float kGoo = t0.z <= 2.8 ? (t0.z * 0.20) : min(4.6, t0.z * 0.75);

  vec3 inkC = vec3(0.165, 0.145, 0.125);
  outColor = vec4(mix(milk, inkC, ink), 1.0);
}`;

}

/* ---------- применение точек и сэмплирование слепка ---------- */
function applyPoints(pts){
  const W = canvas.width/DPR, H = canvas.height/DPR;
  const k = H * 0.74;
  const numBust = pts.length;
  const totalN = numBust + NUM_RING_DROPS;
  allocDrops(totalN);

  const gauss = () => (Math.random()+Math.random()+Math.random())/1.5 - 1;
  let maxDist = 1;
  const wx0 = 0, wy0 = -H*0.10;

  // 1. Точки бюста
  for(let i = 0; i < numBust; i++){
    const pt = pts[i];
    hx[i] = pt[0]*k;
    hy[i] = pt[1]*k + H*0.03;
    ox[i] = gauss()*W*0.18 + (Math.random()-0.5)*W*0.06;
    oy[i] = H*0.15 + gauss()*H*0.12;
    r0[i] = pt[2];
    rCur[i] = r0[i];
    seed[i] = Math.random();
    isRing[i] = 0;

    // Классификация периферии:
    // Лицо (центр ~ 0.02, 0.12) сохраняет стабильность скульптуры (peri ~ 0),
    // Внешние брызги, локоны и растворение торса (peri ~ 0.6..1.0) перетекают
    const df = Math.hypot(pt[0] - 0.02, pt[1] - 0.12);
    let peri = Math.min(1.0, Math.max(0.0, (df - 0.14) / 0.22));
    if (pt[1] < -0.20) peri = Math.max(peri, 0.85);  // постамент / нижний распад
    if (pt[1] > 0.35) peri = Math.max(peri, 0.80);   // верхние локоны
    if (Math.abs(pt[0]) > 0.24) peri = 1.0;          // боковые брызги
    periWeight[i] = peri;

    const d = Math.hypot(hx[i]-wx0, hy[i]-wy0);
    delay[i] = d; if(d > maxDist) maxDist = d;
  }

  // 2. Динамическое орбитальное кольцо с разноскоростными каплями
  for(let j = 0; j < NUM_RING_DROPS; j++){
    const i = numBust + j;
    isRing[i] = 1;
    seed[i] = Math.random();
    
    // Распределение капель на кольце:
    // 10 крупных шариков-спутников (r ~ 4.5..5.8 px) — медленные (omega ~ 0.065)
    // 22 средние капли (r ~ 2.5..3.4 px) — средняя скорость (omega ~ 0.115)
    // 88 тонких пылинок (r ~ 1.3..1.6 px) — быстрые (omega ~ 0.19..0.24)
    if (j % 12 === 0) {
      r0[i] = 4.8 + (j % 3) * 0.35;
      ringSpeed[i] = 0.065;
    } else if (j % 4 === 0) {
      r0[i] = 2.6 + (j % 3) * 0.30;
      ringSpeed[i] = 0.115;
    } else {
      r0[i] = 1.35 + (j % 2) * 0.15;
      ringSpeed[i] = 0.19 + (j % 5) * 0.015;
    }
    rCur[i] = r0[i];
    ringTheta0[i] = (j / NUM_RING_DROPS) * Math.PI * 2 + (Math.sin(j * 3.7) * 0.05);

    // Начальная позиция на кольце при t = 0
    const u = RING_A * Math.cos(ringTheta0[i]);
    const v = RING_B * Math.sin(ringTheta0[i]);
    hx[i] = (u * COS_T - v * SIN_T) * k;
    hy[i] = (RING_Y0 * k) + (u * SIN_T + v * COS_T) * k + H*0.03;
    ox[i] = (u * COS_T - v * SIN_T) * W * 0.45;
    oy[i] = H * 0.25 + gauss() * H * 0.15;
    periWeight[i] = 1.0;

    const d = Math.hypot(hx[i]-wx0, hy[i]-wy0);
    delay[i] = d; if(d > maxDist) maxDist = d;
  }

  for(let i = 0; i < totalN; i++){
    delay[i] = 0.45*(delay[i]/maxDist) + 0.08*seed[i];
    const vx = hx[i]-ox[i], vy = hy[i]-oy[i];
    flen[i] = Math.hypot(vx, vy) || 1;
    fdirx[i] = vx/flen[i]; fdiry[i] = vy/flen[i];
  }
  offX.fill(0); offY.fill(0); stCur.fill(0); stDirX.fill(1); stDirY.fill(0);
}

/* ---------- resize ---------- */
let DPR = 1;
function resize(){
  DPR = Math.min(devicePixelRatio || 1, 2,
                 Math.sqrt(4000000/(innerWidth*innerHeight)));
  canvas.width = Math.round(innerWidth*DPR);
  canvas.height = Math.round(innerHeight*DPR);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gridW = Math.ceil(innerWidth/CELL)+2;
  gridH = Math.ceil(innerHeight/CELL)+2;
  const rows = gridH*K_SLOTS*2;
  if(!gridTex) gridTex = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, gridTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, gridW, rows, 0, gl.RGBA, gl.FLOAT,
                new Float32Array(gridW*rows*4));
  gridData = new Float32Array(gridW*rows*4);
  gridCounters = new Int32Array(gridW*gridH);
}
addEventListener('resize', () => { resize(); if(currentPts) applyPoints(currentPts); else loadSlide(slideIdx, true); });
resize();

/* ---------- курсор и ударные волны ---------- */
const ptr = {
  x: 1e5, y: 1e5, lastX: 0, lastY: 0, accX: 0, accY: 0,
  vx: 0, vy: 0, speed: 0, angle: 0, inside: false,
  moveTo(x, y){
    if(!this.inside){ this.inside = true; this.lastX = x; this.lastY = y; }
    this.accX += x - this.lastX; this.accY += y - this.lastY;
    this.lastX = this.x = x; this.lastY = this.y = y;
  },
  leave(){ this.inside = false; this.accX = 0; this.accY = 0; },
  update(s){
    const k = 1 - Math.pow(0.75, s);
    this.vx += (this.accX - this.vx)*k;
    this.vy += (this.accY - this.vy)*k;
    this.accX = 0; this.accY = 0;
    this.speed = Math.hypot(this.vx, this.vy);
    if(this.speed < 0.1){ this.speed = 0; this.vx = 0; this.vy = 0; }
    else if(this.speed > 0.3) this.angle = Math.atan2(this.vy, this.vx);
  }
};
canvas.addEventListener('pointermove', e => {
  ptr.moveTo(e.clientX - innerWidth/2, (innerHeight - e.clientY) - innerHeight/2);
  if(holdUntil !== Infinity) holdUntil = performance.now() + 6000;
});
canvas.addEventListener('pointerleave', () => ptr.leave());
addEventListener('blur', () => ptr.leave());

const waves = [];
function shockwave(cx, cy){
  waves.push({ cx, cy, t: 0, dur: WAVE_DUR, maxR: WAVE_R, pw: WAVE_PW });
}
canvas.addEventListener('pointerdown', e => {
  ptr.moveTo(e.clientX - innerWidth/2, (innerHeight - e.clientY) - innerHeight/2);
  shockwave(e.clientX - innerWidth/2, (innerHeight - e.clientY) - innerHeight/2);
  if(holdUntil !== Infinity) holdUntil = performance.now() + 6000;
});

/* ---------- фазы: облако ⇄ бюст ---------- */
const PHASE_MAX = 1.45;
let phase = 0, phaseTarget = PHASE_MAX;
let holdUntil = performance.now() + 9500;

function toggleCloud(){
  phaseTarget = phaseTarget > 0.1 ? 0 : PHASE_MAX;
  holdUntil = Infinity;
}
addEventListener('keydown', e => {
  if(e.code === 'Space'){ e.preventDefault(); toggleCloud(); }
  if(e.code === 'KeyN') nextSlide();
});
document.getElementById('next').addEventListener('click', e => { e.stopPropagation(); nextSlide(); });

function nextSlide(){
  slideIdx = (slideIdx+1) % SLIDES.length;
  loadSlide(slideIdx, false);
}

function loadSlide(idx, keepPhase){
  const s = SLIDES[idx];
  document.getElementById('title').textContent = s.title;
  document.getElementById('credit').textContent = s.credit;

  if(BAKED_SLIDES && BAKED_SLIDES[idx]){
    currentPts = BAKED_SLIDES[idx];
    applyPoints(currentPts);
    if(!keepPhase){
      phase = 0;
      phaseTarget = PHASE_MAX;
      holdUntil = performance.now() + 9500;
    }
  }
}
loadSlide(0, false);

/* ---------- заливка grid-текстуры ---------- */
function packDrops(now, s){
  const W = innerWidth, H = innerHeight;
  const k = H * 0.74;
  gridCounters.fill(0);
  gridData.fill(0);

  const kP = 1 - Math.pow(1 - 0.22, s);
  const kS = 1 - Math.pow(1 - 0.25, s);
  const kR = 1 - Math.pow(1 - 0.24, s);

  const rows = K_SLOTS * 2;
  const t0 = now/1000;

  for(let i = 0; i < N; i++){
    const prog = Math.min(1, Math.max(0, phase - delay[i]));
    const p = prog*prog*(3 - 2*prog);
    const bell = 6*prog*(1 - prog);

    let curHx = hx[i];
    let curHy = hy[i];
    let orbVx = 0, orbVy = 0, orbSt = 0;

    if (isRing[i]) {
      // 1. ДИНАМИЧЕСКИЙ ОБРУЧ: обращение по эллипсу с правильным наклоном
      // Быстрые мелкие точки догоняют медленные крупные, сливаясь и отделяясь
      const theta = ringTheta0[i] + ringSpeed[i] * t0;
      const u = RING_A * Math.cos(theta);
      const v = RING_B * Math.sin(theta);
      curHx = (u * COS_T - v * SIN_T) * k;
      curHy = (RING_Y0 * k) + (u * SIN_T + v * COS_T) * k + H*0.03;

      const vu = -RING_A * ringSpeed[i] * Math.sin(theta);
      const vv =  RING_B * ringSpeed[i] * Math.cos(theta);
      orbVx = vu * COS_T - vv * SIN_T;
      orbVy = vu * SIN_T + vv * COS_T;
      const sp = Math.hypot(orbVx, orbVy) || 1;
      orbVx /= sp; orbVy /= sp;
      orbSt = Math.min(0.24, 0.08 + (ringSpeed[i] / 0.20) * 0.12) * p;
    } else {
      // 2. ДВИЖЕНИЕ ВНУТРИ И СНАРУЖИ БЮСТА:
      // Внутри (лицо, peri ~ 0) — мягкое благородное дыхание мрамора (0.35-0.6 px)
      // Снаружи (локоны, распад торса, peri ~ 0.7..1) — волновое перетекание соседних капель (3-6 px)
      const peri = periWeight[i];
      const ph1 = t0 * 0.75 + seed[i] * 6.28;
      const ph2 = t0 * 0.45 + hx[i] * 0.012;
      const driftX = Math.sin(ph1) * (0.35 + 3.8 * peri) + Math.cos(ph2) * (1.8 * peri);
      const driftY = Math.cos(ph1 * 0.85) * (0.40 + 4.2 * peri) + Math.sin(ph2 * 1.2) * (2.0 * peri);

      curHx += driftX * p;
      curHy += driftY * p;
    }

    const cloudDriftX = Math.sin(t0*0.13 + seed[i]*17.0)*8;
    const cloudDriftY = Math.cos(t0*0.11 + seed[i]*23.0)*6 + Math.sin(t0*0.20 + ox[i]*0.006)*9;
    const x = ox[i] + cloudDriftX + (curHx - ox[i] - cloudDriftX)*p + offX[i];
    const y = oy[i] + cloudDriftY + (curHy - oy[i] - cloudDriftY)*p + offY[i];

    const settle = p > 0.92 ? Math.sin((p - 0.92)/0.08*Math.PI)*0.10 : 0;
    let rTarget = r0[i] * (1 + settle);

    let prox = 0;
    if(ptr.inside){
      const ddx = x - ptr.x, ddy = y - ptr.y;
      const d2 = ddx*ddx + ddy*ddy;
      if(d2 < CURSOR_R*CURSOR_R) prox = 1 - Math.sqrt(d2)/CURSOR_R;
    }
    if(prox > 0) rTarget *= 1 + CURSOR_MAXGROW*Math.pow(prox, 1.25);

    let tx = 0, ty = 0, tSt = 0, tdx = fdirx[i], tdy = fdiry[i];

    if (orbSt > 0) {
      tSt = orbSt; tdx = orbVx; tdy = orbVy;
    }

    const lenF = Math.min(1, Math.max(0.25, flen[i]/300));
    const stFlight = bell*(0.12 + 0.32*lenF);
    if(stFlight > tSt){ tSt = stFlight; tdx = fdirx[i]; tdy = fdiry[i]; }

    if(prox > 0 && ptr.speed > 0.4){
      const maxShift = CURSOR_R*0.30;
      let sxp = ptr.vx*0.70, syp = ptr.vy*0.70;
      const m = Math.hypot(sxp, syp);
      if(m > maxShift){ sxp *= maxShift/m; syp *= maxShift/m; }
      tx += sxp*prox; ty += syp*prox;
      const stDrag = Math.min(1.0, (ptr.speed/12)*prox);
      if(stDrag > tSt){ tSt = stDrag; tdx = Math.cos(ptr.angle); tdy = Math.sin(ptr.angle); }
    }

    for(let wv = 0; wv < waves.length; wv++){
      const w = waves[wv];
      const wdx = x - w.cx, wdy = y - w.cy;
      const wd = Math.hypot(wdx, wdy);
      if(wd >= w.maxR) continue;
      const ease = 1 - Math.pow(1 - w.prog, 2.2);
      const front = w.maxR*ease;
      const band = Math.max(12, w.maxR*0.28);
      const diff = wd - front;
      if(Math.abs(diff) < band){
        const pulse = Math.cos((diff/band)*(Math.PI*0.5))*(1 - w.prog);
        const push = pulse*Math.max(8, w.maxR*0.25)*w.pw;
        if(wd > 0.1){ tx += (wdx/wd)*push; ty += (wdy/wd)*push; }
        rTarget *= 1 + 0.35*pulse*w.pw;
        const stW = pulse*0.80*w.pw;
        if(stW > tSt && wd > 0.1){ tSt = stW; tdx = wdx/wd; tdy = wdy/wd; }
      } else if(diff < 0 && w.prog < 0.65){
        rTarget *= Math.max(0.40, 1 - 0.45*w.pw);
      }
    }

    offX[i] += (tx - offX[i])*kP;
    offY[i] += (ty - offY[i])*kP;
    stCur[i] += (tSt - stCur[i])*kS;
    rCur[i] += (rTarget - rCur[i])*kR;

    if(tSt > 0.01){
      stDirX[i] += (tdx - stDirX[i])*kS;
      stDirY[i] += (tdy - stDirY[i])*kS;
    }
    const dl = Math.hypot(stDirX[i], stDirY[i]) || 1;

    const gx = ((x + W*0.5)/CELL)|0;
    const gy = ((y + H*0.5)/CELL)|0;
    if(gx < 0 || gx >= gridW || gy < 0 || gy >= gridH) continue;

    const cell = gy*gridW + gx;
    const slot = gridCounters[cell];
    if(slot >= K_SLOTS) continue;
    gridCounters[cell] = slot + 1;

    const row = gy*rows + slot*2;
    const a = (row*gridW + gx)*4;
    gridData[a] = x; gridData[a+1] = y; gridData[a+2] = rCur[i]; gridData[a+3] = stCur[i];
    
    if (stCur[i] >= 0.02) {
      const b = ((row+1)*gridW + gx)*4;
      gridData[b] = stDirX[i]/dl; gridData[b+1] = stDirY[i]/dl;
    }
  }

  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, gridTex);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, gridW, gridH*rows,
                   gl.RGBA, gl.FLOAT, gridData);
}

/* ---------- цикл ---------- */
let tPrev = performance.now();
function frame(now){
  const dt = Math.min(100, now - tPrev) || 16.7;
  tPrev = now;
  const s = dt/16.667;

  // 4-фазный цикл сборки (01 рассеивание -> 02 притяжение -> 03 сборка -> 04 уплотнение ~3.2с)
  const speed = phaseTarget > phase ? 0.45 : 0.70;
  phase += Math.sign(phaseTarget - phase)*Math.min(Math.abs(phaseTarget - phase), dt/1000*speed);

  if(holdUntil !== Infinity){
    if(Math.abs(phase - phaseTarget) < 0.02){
      if(now > holdUntil){
        if(phaseTarget > 0.1){
          phaseTarget = 0;
          holdUntil = now + 2600;
        } else {
          phaseTarget = PHASE_MAX;
          holdUntil = now + 9500;
        }
      }
    } else {
      holdUntil = now + (phaseTarget > 0.1 ? 9500 : 2600);
    }
  }

  ptr.update(s);
  for(let w = waves.length-1; w >= 0; w--){
    const wave = waves[w];
    wave.t += dt;
    if(wave.t >= wave.dur) waves.splice(w, 1);
    else wave.prog = wave.t/wave.dur;
  }

  if(N > 0) packDrops(now, s);

  gl.uniform2f(U.u_res, innerWidth, innerHeight);
  gl.uniform1f(U.u_dpr, DPR);
  gl.uniform1i(U.u_grid, 0);
  gl.uniform2f(U.u_gridSize, gridW, gridH);
  gl.drawArrays(gl.TRIANGLES, 0, 6);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
