<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNTESIS — Orbital Ring Optical Refinement</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;400;500;600&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: #000000;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background 0.3s ease, color 0.3s ease;
      overflow-x: hidden;
    }

    body.theme-light {
      background: #fbfbfa;
      color: #18191d;
    }

    /* Top Control Bar */
    .toolbar {
      width: 100%;
      max-width: 1200px;
      padding: 20px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      z-index: 50;
      transition: border-color 0.3s ease;
    }

    body.theme-light .toolbar {
      border-bottom-color: rgba(0, 0, 0, 0.1);
    }

    .toolbar-title {
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .toolbar-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(0, 240, 255, 0.15);
      color: #00f0ff;
      border: 1px solid rgba(0, 240, 255, 0.3);
    }

    body.theme-light .toolbar-badge {
      background: rgba(0, 180, 220, 0.12);
      color: #008fa8;
      border-color: rgba(0, 180, 220, 0.25);
    }

    .toolbar-controls {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 7px 16px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: transparent;
      color: inherit;
    }

    .btn:hover {
      border-color: #00f0ff;
      color: #00f0ff;
      transform: translateY(-1px);
    }

    .btn-primary {
      background: rgba(0, 240, 255, 0.15);
      border-color: rgba(0, 240, 255, 0.4);
      color: #00f0ff;
    }

    body.theme-light .btn-primary {
      background: rgba(0, 0, 0, 0.85);
      border-color: #000000;
      color: #ffffff;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 9px;
      letter-spacing: 0.15em;
      font-family: 'JetBrains Mono', monospace;
      opacity: 0.75;
    }

    .slider {
      appearance: none;
      width: 90px;
      height: 3px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 2px;
      outline: none;
    }

    body.theme-light .slider {
      background: rgba(0, 0, 0, 0.2);
    }

    .slider::-webkit-slider-thumb {
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #00f0ff;
      cursor: pointer;
    }

    /* Main Showcase Stage */
    .stage-container {
      width: 100%;
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .viewer-card {
      position: relative;
      width: 100%;
      aspect-ratio: 1024 / 576;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: #000000;
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    body.theme-light .viewer-card {
      background: #ffffff;
      border-color: rgba(0, 0, 0, 0.08);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.06);
    }

    .ring-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 2;
    }

    /* Reference overlay image for exact A/B comparison */
    .ref-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      z-index: 3;
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    /* Side-by-Side Comparison Container */
    .comparison-grid {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 10px;
    }

    .comparison-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .col-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      opacity: 0.6;
    }

    .col-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 1024 / 576;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: #000000;
    }

    .col-frame img, .col-frame canvas {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    .nav-tabs {
      display: flex;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    body.theme-light .nav-tabs {
      background: rgba(0, 0, 0, 0.04);
      border-color: rgba(0, 0, 0, 0.08);
    }

    .tab-btn {
      font-family: 'Montserrat', sans-serif;
      font-size: 9.5px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 6px 16px;
      border-radius: 20px;
      border: none;
      background: transparent;
      color: inherit;
      opacity: 0.65;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.is-active {
      background: #00f0ff;
      color: #000000;
      font-weight: 600;
      opacity: 1;
    }

    body.theme-light .tab-btn.is-active {
      background: #18191d;
      color: #ffffff;
    }

    .footer-note {
      font-size: 9px;
      letter-spacing: 0.22em;
      opacity: 0.45;
      margin-bottom: 30px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <header class="toolbar">
    <div class="toolbar-title">
      <span>UNTESIS</span>
      <span class="toolbar-badge">OPTICAL REF SPECIMEN</span>
    </div>

    <div class="nav-tabs">
      <button class="tab-btn is-active" id="btn-tab-dark">1:1 Ref (Dark)</button>
      <button class="tab-btn" id="btn-tab-light">Site Light</button>
      <button class="tab-btn" id="btn-tab-compare">Side-by-Side</button>
    </div>

    <div class="toolbar-controls">
      <div class="control-group">
        <label for="overlay-slider">Ref Overlay:</label>
        <input type="range" id="overlay-slider" class="slider" min="0" max="100" value="0">
        <span id="overlay-val">0%</span>
      </div>

      <div class="control-group">
        <label for="glow-slider">Glow:</label>
        <input type="range" id="glow-slider" class="slider" min="50" max="200" value="100">
        <span id="glow-val">1.0x</span>
      </div>

      <button class="btn btn-primary" id="btn-burst">[ PHASE BURST ]</button>
    </div>
  </header>

  <main class="stage-container">
    <!-- Single Interactive Live Viewer -->
    <div class="viewer-card" id="main-viewer">
      <canvas id="ring-canvas" class="ring-canvas"></canvas>
      <img src="assets/orbital-ring-ref.jpg" alt="Original Ref" class="ref-overlay" id="ref-overlay">
    </div>

    <!-- Side-by-Side View (hidden by default) -->
    <div class="comparison-grid" id="comparison-grid" style="display: none;">
      <div class="comparison-col">
        <span class="col-label">01 // YOUR REFERENCE (media_1794300905378_758a855f.jpg)</span>
        <div class="col-frame">
          <img src="assets/orbital-ring-ref.jpg" alt="User Reference">
        </div>
      </div>
      <div class="comparison-col">
        <span class="col-label">02 // PROCEDURAL RECONSTRUCTION (Canvas 2D / WebGL)</span>
        <div class="col-frame">
          <canvas id="compare-canvas"></canvas>
        </div>
      </div>
    </div>

    <div class="footer-note">
      Center (520, 267) · Tilt -14.3° · a=463px b=137px · Flare1 @ 308.6° · Flare2 @ 136.5°
    </div>
  </main>

  <script src="hero-ring.js"></script>
  <script>
    const canvas = document.getElementById('ring-canvas');
    const ring = new UntesisRing(canvas, { mode: 'dark', intensity: 1.0 });

    const refOverlay = document.getElementById('ref-overlay');
    const overlaySlider = document.getElementById('overlay-slider');
    const overlayVal = document.getElementById('overlay-val');

    overlaySlider.addEventListener('input', (e) => {
      const v = e.target.value;
      refOverlay.style.opacity = (v / 100).toFixed(2);
      overlayVal.textContent = v + '%';
    });

    const glowSlider = document.getElementById('glow-slider');
    const glowVal = document.getElementById('glow-val');
    glowSlider.addEventListener('input', (e) => {
      const v = e.target.value / 100;
      ring.setIntensity(v);
      glowVal.textContent = v.toFixed(1) + 'x';
    });

    document.getElementById('btn-burst').addEventListener('click', () => {
      ring.triggerGlitch(1.4);
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        ring.triggerGlitch(1.4);
      }
    });

    // Tab Navigation
    const btnDark = document.getElementById('btn-tab-dark');
    const btnLight = document.getElementById('btn-tab-light');
    const btnCompare = document.getElementById('btn-tab-compare');
    const mainViewer = document.getElementById('main-viewer');
    const comparisonGrid = document.getElementById('comparison-grid');

    let compareRing = null;

    function setTab(activeTab) {
      [btnDark, btnLight, btnCompare].forEach(b => b.classList.remove('is-active'));
      activeTab.classList.add('is-active');

      if (activeTab === btnDark) {
        document.body.classList.remove('theme-light');
        mainViewer.style.display = 'block';
        comparisonGrid.style.display = 'none';
        ring.setMode('dark');
      } else if (activeTab === btnLight) {
        document.body.classList.add('theme-light');
        mainViewer.style.display = 'block';
        comparisonGrid.style.display = 'none';
        ring.setMode('light');
      } else if (activeTab === btnCompare) {
        document.body.classList.remove('theme-light');
        mainViewer.style.display = 'none';
        comparisonGrid.style.display = 'grid';
        if (!compareRing) {
          const compCanvas = document.getElementById('compare-canvas');
          compareRing = new UntesisRing(compCanvas, { mode: 'dark', intensity: 1.0 });
        }
      }
    }

    btnDark.addEventListener('click', () => setTab(btnDark));
    btnLight.addEventListener('click', () => setTab(btnLight));
    btnCompare.addEventListener('click', () => setTab(btnCompare));
  </script>
</body>
</html>
