<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>МНЕНИЯ</title>
  <link rel="stylesheet" href="landing.css?v=3">
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script defer src="landing.js"></script>
  <script defer src="bust-section.js"></script>
</head>
<body>
  <main class="hero">
    <div class="hero-composition" id="hero-composition" aria-hidden="true">
      <!-- Horizontal Axis: exactly 70% of screen width -->
      <svg class="hero-axis-svg" id="hero-axis-svg" viewBox="0 0 1000 8" preserveAspectRatio="none">
        <line class="hero-dashes-axis" x1="0" y1="4" x2="1000" y2="4" vector-effect="non-scaling-stroke" />
      </svg>

      <!-- Orbital Lines (large tilted orbit & ellipse, passing under cloud and arches) -->
      <div class="hero-orbits-wrapper" id="hero-orbits-wrapper">
        <svg class="hero-orbits" id="hero-orbits" viewBox="-1000 -600 2000 1200" preserveAspectRatio="xMidYMid meet">
          <g class="orbit-group-paths">
            <!-- Primary Ellipse (Orbit 1, tilted -11deg, 650x230) -->
            <ellipse class="hero-orbit-path hero-dashes-ellipse" cx="0" cy="0" rx="650" ry="230" transform="rotate(-11)" vector-effect="non-scaling-stroke" />
            
            <!-- New Large Tilted Orbit (tilted 26deg, 800x740, passes under cloud and arches) -->
            <ellipse class="hero-orbit-path hero-dashes-large" cx="0" cy="0" rx="800" ry="740" transform="rotate(26)" vector-effect="non-scaling-stroke" />
          </g>
          
          <g class="orbit-group-runners" id="orbit-group-runners">
            <!-- Runner orbiting along the new large tilted orbit -->
            <g transform="rotate(26)">
              <g class="hero-circle-runner-group" id="hero-circle-runner-group">
                <circle class="hero-orbit-runner hero-circle-runner" cx="800" cy="0" r="3.4" />
              </g>
            </g>
            
            <!-- Runner gliding along the tilted ellipse -->
            <circle class="hero-orbit-runner hero-ellipse-runner" id="hero-ellipse-runner" cx="638" cy="-124" r="3.8" />
          </g>
        </svg>
      </div>

      <!-- Arches at bottom-right, positioned over the large orbit -->
      <div class="hero-asset hero-arches" id="hero-arches">
        <img src="assets/hero-arches.png" alt="" draggable="false">
      </div>
    </div>

    <!-- Drifting Clouds Layer: floating over hero text -->
    <div class="drifting-clouds-layer" id="drifting-clouds-layer" aria-hidden="true"></div>

    <h1 class="wordmark">МНЕНИЯ</h1>

    <!-- Scroll Down Prompt -->
    <a href="#sculpture-section" class="hero-scroll-down" id="hero-scroll-down" aria-label="Скролл вниз">
      <svg class="scroll-dots-svg" id="scroll-dots-svg" viewBox="-20 -36 40 72" width="34" height="60" aria-hidden="true">
        <circle class="scroll-dot" id="scroll-dot-0" cx="3" cy="-22.5" r="6.2" />
        <circle class="scroll-dot" id="scroll-dot-1" cx="-5.5" cy="-1" r="5.2" />
        <circle class="scroll-dot" id="scroll-dot-2" cx="-0.8" cy="19" r="2.4" />
      </svg>
      <span class="scroll-text">scroll</span>
    </a>
  </main>

  <!-- Interactive Point Bust Section -->
  <section class="sculpture-section" id="sculpture-section">
    <canvas id="bust-canvas" class="bust-canvas" aria-label="Интерактивный точечный бюст Давида"></canvas>
  </section>

  <canvas id="gl-canvas" class="gl-layer" aria-hidden="true"></canvas>
</body>
</html>
